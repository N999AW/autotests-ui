name: UI tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Разрешаем GitHub Actions записывать результат в репозиторий
permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Получаем код
      # =========================
      - name: Check out repository
        uses: actions/checkout@v6

      # =========================
      # 2. Устанавливаем Python
      # =========================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # =========================
      # 3. Устанавливаем зависимости
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # =========================
      # 4. Запускаем тесты
      # =========================
      - name: Run Playwright tests
        run: |
          pytest -m regression \
            --alluredir=./allure-results \
            --numprocesses 2

      # =========================
      # 5. Получаем предыдущую историю Allure
      # =========================
      - name: Get Allure history
        if: always()
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # =========================
      # 6. Копируем историю в результаты
      # =========================
      - name: Restore Allure history
        if: always()
        run: |
          if [ -d "gh-pages/history" ]; then
            mkdir -p allure-results/history
            cp -R gh-pages/history/. allure-results/history/
          fi

      # =========================
      # 7. Генерируем Allure report
      # =========================
      - name: Generate Allure report
        if: always()
        run: |
          docker run --rm \
            -v "$(pwd)/allure-results:/app/allure-results" \
            -v "$(pwd)/allure-report:/app/allure-report" \
            frankescobar/allure-docker-service:latest \
            allure generate /app/allure-results \
            -o /app/allure-report \
            --clean

      # =========================
      # 8. Публикуем Allure report
      # =========================
      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          enable_jekyll: false